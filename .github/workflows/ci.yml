name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

jobs:
  verify:
    name: Production gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Record CI revision
        run: |
          mkdir -p ci-evidence
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const sourceCommit = process.env.GITHUB_SHA ?? '';
          if (!/^[a-f0-9]{40}$/i.test(sourceCommit)) {
            throw new Error('GITHUB_SHA must be a full 40-character commit SHA.');
          }

          const metadata = {
            sourceCommit,
            repository: process.env.GITHUB_REPOSITORY,
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            event: process.env.GITHUB_EVENT_NAME,
            ref: process.env.GITHUB_REF,
            recordedAt: new Date().toISOString(),
          };

          writeFileSync('ci-evidence/run-metadata.json', `${JSON.stringify(metadata, null, 2)}\n`);
          NODE

      - name: Verify Git text line endings
        run: node scripts/check-git-eol.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint warning budget
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Unit and integration tests
        run: npm run test:run

      - name: CI artifact tooling tests
        run: node node_modules/vitest/vitest.mjs run scripts/check-bundle-budget.test.mjs scripts/check-ci-evidence-artifact.test.mjs

      - name: Coverage gate
        run: npm run test:coverage -- --reporter=dot

      - name: E2E smoke and accessibility
        run: npm run test:e2e

      - name: Dependency audit
        run: npm run audit:high

      - name: Dependency license policy
        run: npm run licenses:check

      - name: Security boundary policy
        run: npm run security:check

      - name: Environment boundary policy
        run: npm run env:check

      - name: OpenAPI contract policy
        run: npm run contracts:check

      - name: Architecture check
        run: npm run architecture:check

      - name: Architecture inventory
        run: npm run architecture:inventory:check

      - name: Scenario evidence provenance tests
        run: node node_modules/vitest/vitest.mjs run docs/architecture/production-readiness/evidence/A06/scenario-evidence-provenance.test.mjs

      - name: Deterministic scenario matrix
        run: |
          node docs/architecture/production-readiness/evidence/A06/generate-scenario-matrix.mjs --write
          node docs/architecture/production-readiness/evidence/A06/generate-scenario-matrix.mjs --check

      - name: Deterministic UI acceptance index
        run: |
          node docs/architecture/production-readiness/evidence/C05/generate-ui-acceptance-index.mjs --write
          node docs/architecture/production-readiness/evidence/C05/generate-ui-acceptance-index.mjs --check

      - name: Page size gate
        run: npm run page-size:check

      - name: Production mock import budget
        run: npm run production-mock-imports:check

      - name: Production route boundaries
        run: npm run production-routes:check

      - name: Build
        run: npm run build

      - name: Production mock exclusion
        run: npm run production-mocks:check

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs --manifest ci-evidence/bundle-manifest.json

      - name: Upload CI evidence
        id: upload-ci-evidence
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: vittrade-ci-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ci-evidence/
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: warn

      - name: Download uploaded CI evidence for verification
        if: success() && steps.upload-ci-evidence.outcome == 'success'
        uses: actions/download-artifact@v8
        with:
          name: vittrade-ci-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vittrade-ci-evidence-${{ github.sha }}-${{ github.run_attempt }}

      - name: Verify uploaded CI evidence
        if: success() && steps.upload-ci-evidence.outcome == 'success'
        run: node scripts/check-ci-evidence-artifact.mjs "$RUNNER_TEMP/vittrade-ci-evidence-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
