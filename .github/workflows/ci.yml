name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      reused_run_id: ${{ steps.classify.outputs.reused_run_id }}
      runtime_fingerprint: ${{ steps.classify.outputs.runtime_fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify immutable scope reader runtime
        run: python3 --version
      - name: Verify CI scope and failure handling
        run: node --test scripts/ci-scope.node-test.mjs
      - name: Verify source catalogue content integrity
        run: node --test scripts/source-content.node-test.mjs
      - name: Classify inputs and previous exact-source gate
        id: classify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci-scope.mjs classify
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-scope-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .artifacts/ci/**
          retention-days: 7
          if-no-files-found: error

  static:
    name: Static and build gates
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The source ledger verifies historical Git blobs, not only the latest checkout.
          fetch-depth: 0

      - name: Initialize static verification context
        run: |
          set -euo pipefail
          mkdir -p .artifacts/ci
          printf '{"schemaVersion":1,"phase":"started","checkoutSha":"%s","runId":"%s","attempt":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .artifacts/ci/static-context.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify Git text line endings
        run: node scripts/check-git-eol.mjs

      - name: Install dependencies
        run: npm ci

      - name: Verify complete UI shard evidence and failure handling
        run: node --test scripts/ci-ui-shards.node-test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Lint warning budget
        run: npm run lint:check

      - name: Format check
        run: npm run format:check

      - name: Dependency audit
        run: |
          set -euo pipefail
          npm run audit:high 2>&1 | tee .artifacts/ci/dependency-audit.log

      - name: Dependency license policy
        run: npm run licenses:check

      - name: Security boundary policy
        run: npm run security:check

      - name: Environment boundary policy
        run: npm run env:check

      - name: OpenAPI contract policy
        run: npm run contracts:check

      - name: OpenAPI and MSW route parity
        run: npm run contracts:mock-parity

      - name: Architecture check
        run: npm run architecture:check

      - name: Architecture inventory
        run: npm run architecture:inventory:check

      - name: Readiness source ledger
        run: node docs/architecture/production-readiness/check-tracking.mjs

      - name: Readiness route matrix
        run: node docs/architecture/production-readiness/evidence/C06/generate-route-matrix.mjs --working-tree --check

      - name: Page size gate
        run: npm run page-size:check

      - name: Production mock import budget
        run: npm run production-mock-imports:check

      - name: Design system changed-code guard
        run: |
          node --input-type=module -e 'import { checkDesignSystemDiff } from "./scripts/check-design-system-diff.mjs"; const report = checkDesignSystemDiff(); console.log(JSON.stringify(report, null, 2)); if (!report.passed) process.exit(1);'

      - name: Production route boundaries
        run: npm run production-routes:check

      - name: Build
        env:
          # These reserved test origins satisfy build validation only; this workflow does not deploy them.
          VITE_DATA_SOURCE: api
          VITE_API_BASE_URL: https://api.ci.example.test
          VITE_WS_URL: wss://ws.ci.example.test
          VITE_APP_NAME: VitTrade CI
          VITE_RELEASE_VERSION: ci-validation
          VITE_ENABLE_ANALYTICS: 'false'
          VITE_ENABLE_DEVTOOLS: 'false'
        run: npm run build

      - name: Production mock exclusion
        run: npm run production-mocks:check

      - name: Bundle budget
        run: npm run bundle:check

      - name: Preserve verification reports
        if: always()
        id: verification-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: production-static-${{ github.sha }}-${{ github.run_attempt }}
          # Select only run evidence; hidden project config and cache are excluded.
          include-hidden-files: true
          path: |
            .artifacts/ci/static-context.json
            .artifacts/ci/dependency-audit.log
            .artifacts/runs/**/run.json
            .artifacts/runs/**/coverage/**
            .artifacts/runs/**/playwright-report/**
            .artifacts/runs/**/test-results/**
            .artifacts/cleanup-report.json
          retention-days: 7
          if-no-files-found: error

      - name: Record verification artifact digest
        if: always() && steps.verification-artifacts.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.verification-artifacts.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.verification-artifacts.outputs.artifact-digest }}
        run: |
          printf 'Verification artifact ID: %s\n\nSHA-256: `%s`\n' "$ARTIFACT_ID" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  unit:
    name: Unit and coverage
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # test:coverage executes the same complete suite as test:run; scope tests
      # enforce command parity. Assertions and coverage thresholds are unchanged.
      - name: Unit, integration and coverage gate
        run: npm run test:coverage -- --reporter=dot
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-unit-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .artifacts/runs/**/run.json
            .artifacts/runs/**/coverage/**
            .artifacts/cleanup-report.json
          retention-days: 7
          if-no-files-found: error

  browser:
    name: Browser ${{ matrix.suite }}
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: smoke
            config: playwright.config.ts
          - suite: auth-api
            config: playwright.auth-api.config.ts
          - suite: auth-mock
            config: playwright.auth-mock.config.ts
          - suite: ui-mock
            config: playwright.ui-mock.config.ts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Discover the complete UI test denominator
        if: matrix.suite == 'ui-mock'
        env:
          VITTRADE_UI_SHARD: ''
          PLAYWRIGHT_JSON_OUTPUT_FILE: .artifacts/ci/ui-plan.json
        run: npm run test:e2e -- --config playwright.ui-mock.config.ts --list --reporter=json
      - name: Browser contract
        env:
          BROWSER_PROFILE: ${{ matrix.suite }}
          BROWSER_CONFIG: ${{ matrix.config }}
          VITTRADE_UI_SHARD: ${{ matrix.suite == 'ui-mock' && '1/3' || '' }}
        run: |
          set -euo pipefail
          if [ "$BROWSER_PROFILE" = "auth-mock" ]; then
            VITE_ENABLE_DEVTOOLS=true npm run test:e2e -- --config "$BROWSER_CONFIG"
            VITE_ENABLE_DEVTOOLS=false npm run test:e2e -- --config playwright.preview-defaults.config.ts
          elif [ "$BROWSER_PROFILE" = "ui-mock" ]; then
            VITE_ENABLE_DEVTOOLS=true npm run test:e2e -- --config "$BROWSER_CONFIG"
          else
            npm run test:e2e -- --config "$BROWSER_CONFIG"
          fi
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-${{ matrix.suite }}-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .artifacts/ci/ui-plan.json
            .artifacts/runs/**/run.json
            .artifacts/runs/**/playwright-report/**
            .artifacts/runs/**/test-results/**
            .artifacts/cleanup-report.json
          retention-days: 7
          if-no-files-found: error

  ui_shards:
    name: Browser ui-mock ${{ matrix.shard }}/3
    needs: scope
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser contract
        env:
          VITTRADE_UI_SHARD: ${{ matrix.shard }}/3
          VITE_ENABLE_DEVTOOLS: 'true'
        run: npm run test:e2e -- --config playwright.ui-mock.config.ts
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-ui-mock-${{ matrix.shard }}-of-3-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            .artifacts/runs/**/run.json
            .artifacts/runs/**/playwright-report/**
            .artifacts/runs/**/test-results/**
            .artifacts/cleanup-report.json
          retention-days: 7
          if-no-files-found: error

  ui_coverage:
    name: Complete UI coverage
    needs: [scope, browser, ui_shards]
    if: always() && needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          pattern: production-browser-ui-mock-*${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/ui-input
      - name: Verify every UI ID exactly once from this source and run
        env:
          CI_UI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-ui-shards.mjs .artifacts/ui-input
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-ui-coverage-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .artifacts/ci/ui-coverage.json
          retention-days: 7
          if-no-files-found: error

  metadata:
    name: Progress metadata gate
    needs: scope
    if: needs.scope.outputs.mode == 'metadata-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify metadata text and ledger
        run: |
          mkdir -p .artifacts/ci
          node scripts/check-git-eol.mjs
          git diff --check HEAD^ HEAD
          node scripts/ci-scope.mjs ledger-format
          node docs/architecture/production-readiness/check-tracking.mjs | tee .artifacts/ci/readiness.txt
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-metadata-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .artifacts/ci/**
          retention-days: 7
          if-no-files-found: error

  verify:
    # Stable required-check name; conditional jobs cannot silently bypass it.
    name: Production gates
    needs: [scope, static, unit, browser, ui_shards, ui_coverage, metadata]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require complete UI coverage for the selected scope
        env:
          CI_UI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-ui-shards.mjs gate
      - name: Verify every applicable gate
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-scope.mjs gate
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-gate-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: .artifacts/ci/**
          retention-days: 7
          if-no-files-found: error
