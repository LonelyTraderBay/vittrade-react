openapi: 3.1.0
info:
  title: VitTrade P2P Marketplace API
  version: 0.1.0
  description: Contract-first read model for P2P marketplace offers.
servers:
  - url: https://api.example.invalid/v1
security:
  - sessionCookie: []
paths:
  /p2p/overview:
    get:
      operationId: getP2POverview
      responses:
        '200':
          description: User level, trading levels and public marketplace statistics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2POverviewResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /p2p/dashboard:
    get:
      operationId: getP2PDashboard
      responses:
        '200':
          description: Authenticated user's P2P trading analytics.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PDashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /p2p/achievements:
    get:
      operationId: getP2PAchievements
      responses:
        '200':
          description: Authenticated user's P2P achievements and progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PAchievementsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /p2p/ads/{adId}/analytics:
    get:
      operationId: getP2PAdAnalytics
      parameters:
        - name: adId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Authenticated merchant analytics for one P2P offer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PAdAnalytics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /p2p/merchants/{merchantId}:
    get:
      operationId: getP2PMerchantProfile
      parameters:
        - name: merchantId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public merchant profile, active ads and reviews.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PMerchantProfileResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
  /p2p/reports/merchants:
    post:
      operationId: reportP2PMerchant
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PReportCreateRequest' }
      responses:
        '201':
          description: Merchant report submitted for compliance review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PReportReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /p2p/payment-methods:
    get:
      operationId: listP2PPaymentMethods
      responses:
        '200':
          description: Payment methods owned by the authenticated P2P user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PPaymentMethodsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createP2PPaymentMethod
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PPaymentMethodCreateRequest' }
      responses:
        '201':
          description: Payment method created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PPaymentMethod' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: A duplicate payment method already exists. }
  /p2p/payment-methods/{methodId}:
    patch:
      operationId: updateP2PPaymentMethod
      parameters:
        - name: methodId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PPaymentMethodUpdateRequest' }
      responses:
        '200':
          description: Payment method updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PPaymentMethod' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteP2PPaymentMethod
      parameters:
        - name: methodId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Payment method deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /p2p/disputes:
    get:
      operationId: listP2PDisputes
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [submitted, under_review, resolved, rejected] }
      responses:
        '200':
          description: Disputes owned by the authenticated P2P user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PDisputesResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /p2p/disputes/{disputeId}:
    get:
      operationId: getP2PDispute
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dispute detail, timeline and support conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PDispute' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /p2p/disputes/{disputeId}/messages:
    post:
      operationId: sendP2PDisputeMessage
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PDisputeMessageRequest' }
      responses:
        '200':
          description: Dispute with appended support message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PDispute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /p2p/disputes/{disputeId}/escalate:
    post:
      operationId: escalateP2PDispute
      parameters:
        - name: disputeId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PDisputeEscalationRequest' }
      responses:
        '200':
          description: Dispute moved to the requested escalation level.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PDispute' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /p2p/blacklist:
    get:
      operationId: listP2PBlacklist
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: reason
          in: query
          schema: { type: string, enum: [scam, unresponsive, fake_payment, harassment, other] }
      responses:
        '200':
          description: Counterparties blocked by the authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PBlacklistResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createP2PBlacklistEntry
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PBlacklistCreateRequest' }
      responses:
        '201':
          description: Counterparty blocked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PBlacklistEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /p2p/blacklist/{entryId}:
    delete:
      operationId: removeP2PBlacklistEntry
      parameters:
        - name: entryId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Counterparty unblocked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /p2p/reviews:
    get:
      operationId: listP2PReviews
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [received, given], default: received }
      responses:
        '200':
          description: Reviews received or written by the authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PReviewsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /p2p/security/2fa/settings:
    get:
      operationId: getP2P2FASettings
      responses:
        '200':
          description: Current P2FA methods and transaction thresholds.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2P2FASettingsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /p2p/security/2fa/methods/{methodId}:
    patch:
      operationId: updateP2P2FAMethod
      parameters:
        - {
            name: methodId,
            in: path,
            required: true,
            schema: { type: string, enum: [2fa_sms, 2fa_authenticator, 2fa_email] },
          }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated P2FA settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2P2FASettingsResponse' }
  /p2p/security/2fa/primary:
    post:
      operationId: setP2P2FAPrimaryMethod
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [methodId]
              properties:
                methodId: { type: string, enum: [2fa_sms, 2fa_authenticator, 2fa_email] }
      responses:
        '200':
          description: Updated P2FA settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2P2FASettingsResponse' }
  /p2p/security/2fa/thresholds/{thresholdId}:
    patch:
      operationId: updateP2P2FAThreshold
      parameters:
        - {
            name: thresholdId,
            in: path,
            required: true,
            schema: { type: string, enum: [release, create_order, cancel_order] },
          }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: { type: number, minimum: 0 }
                enabled: { type: boolean }
      responses:
        '200':
          description: Updated P2FA settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2P2FASettingsResponse' }
  /p2p/security/2fa/authenticator/setup:
    post:
      operationId: beginP2PAuthenticatorSetup
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Authenticator enrollment challenge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PAuthenticatorSetupChallenge' }
  /p2p/security/2fa/authenticator/confirm:
    post:
      operationId: confirmP2PAuthenticatorSetup
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\\d{6}$' }
      responses:
        '200':
          description: Authenticator method enabled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2P2FASettingsResponse' }
        '401': { description: Authenticator code is invalid. }
  /p2p/ads:
    post:
      operationId: createP2PAd
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PAdCreateRequest' }
      responses:
        '201':
          description: P2P offer created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PAd' }
        '409':
          description: Duplicate or conflicting offer request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      operationId: listP2PAds
      parameters:
        - { name: asset, in: query, schema: { type: string } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, enum: [buy, sell] } }
        - { name: mine, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Active P2P marketplace offers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PAdsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /p2p/ads/{adId}:
    patch:
      operationId: updateP2PAdStatus
      parameters:
        - name: adId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PAdStatusUpdateRequest' }
      responses:
        '200':
          description: P2P offer status updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PAd' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteP2PAd
      parameters:
        - name: adId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: P2P offer deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      operationId: getP2PAd
      parameters:
        - name: adId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: P2P offer detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PAd' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /p2p/orders:
    get:
      operationId: listP2POrders
      parameters:
        - name: status
          in: query
          schema:
            { type: string, enum: [pending_payment, paid, released, disputed, cancelled, expired] }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Current user's P2P order history.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/P2POrder' } }
                  total: { type: integer, minimum: 0 }
                  nextCursor: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createP2POrder
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2POrderRequest' }
      responses:
        '201':
          description: Escrow order created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2POrderReceipt' }
        '409':
          description: Duplicate or conflicting order request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /p2p/orders/{orderId}:
    get:
      operationId: getP2POrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Escrow order detail and payment instructions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2POrder' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /p2p/orders/{orderId}/mark-paid:
    post:
      operationId: markP2POrderPaid
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Payment marked by the buyer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2POrder' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Order cannot transition to paid. }
  /p2p/orders/{orderId}/release:
    post:
      operationId: releaseP2POrderEscrow
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationToken]
              properties:
                verificationToken: { type: string, minLength: 1 }
      responses:
        '200':
          description: Escrow released after authorization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2POrder' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Order cannot transition to released. }
  /p2p/orders/{orderId}/release/challenge:
    post:
      operationId: createP2PReleaseChallenge
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '201':
          description: One-time MFA challenge for escrow release.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PReleaseChallenge' }
        '403': { description: Release authorization is not available. }
  /p2p/orders/{orderId}/release/challenge/{challengeId}/verify:
    post:
      operationId: verifyP2PReleaseChallenge
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - name: challengeId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\\d{6}$' }
      responses:
        '200':
          description: Short-lived token authorizing escrow release.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PReleaseVerification' }
        '401': { description: Invalid or expired MFA code. }
  /p2p/orders/{orderId}/cancel:
    post:
      operationId: cancelP2POrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '200':
          description: Order cancelled and escrow state updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2POrder' }
        '400': { description: Cancellation reason is invalid. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Order cannot transition to cancelled. }
  /p2p/orders/{orderId}/rate:
    post:
      operationId: rateP2POrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                review: { type: string, maxLength: 2000 }
                tags: { type: array, items: { type: string, maxLength: 80 }, maxItems: 10 }
      responses:
        '200':
          description: Order rating recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2POrder' }
        '400': { description: Rating is invalid. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Order cannot be rated. }
  /p2p/orders/{orderId}/payment-proof:
    post:
      operationId: submitP2PPaymentProof
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Payment proof attached to the order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2POrder' }
        '400': { description: Proof files are missing or invalid. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Order cannot accept payment proof. }
  /p2p/orders/{orderId}/chat:
    get:
      operationId: getP2POrderChat
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: E2E chat history associated with an order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PChatResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /p2p/orders/{orderId}/chat/messages:
    post:
      operationId: sendP2PChatMessage
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/P2PChatMessageRequest' }
      responses:
        '200':
          description: Updated E2E chat state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/P2PChatResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16 }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vittrade_session
  responses:
    Unauthorized:
      description: Session is missing or expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    BadRequest:
      description: Request validation failed.
