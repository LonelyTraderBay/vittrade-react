openapi: 3.1.0
info:
  title: VitTrade Market API
  version: 0.1.0
  description: Public market-data contracts and authenticated user-owned watchlist and alert contracts.
servers:
  - url: https://api.example.invalid/v1
paths:
  /market/overview:
    get:
      operationId: getMarketOverview
      security: []
      responses:
        '200':
          description: Aggregated market overview snapshot.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketOverviewResponse' }
  /market/movers:
    get:
      operationId: getMarketMovers
      security: []
      parameters:
        - name: timeframe
          in: query
          required: true
          schema: { type: string, enum: [1h, 24h, 7d] }
        - name: view
          in: query
          required: true
          schema:
            { type: string, enum: [gainers, losers, most-active, unusual-volume, new-listings] }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Filtered market movers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketMoversResponse' }
  /market/news:
    get:
      operationId: getMarketNews
      security: []
      parameters:
        - name: category
          in: query
          schema: { type: string, enum: [market, macro, regulation, project] }
        - name: sentiment
          in: query
          schema: { type: string, enum: [bullish, neutral, bearish] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Recent market news from configured sources.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketNewsResponse' }
        '503':
          description: No news source is configured or available.
  /market/calendar:
    get:
      operationId: getMarketCalendar
      security: []
      parameters:
        - name: type
          in: query
          schema:
            {
              type: string,
              enum: [unlock, upgrade, halving, airdrop, listing, fork, burn, conference, report],
            }
        - name: impact
          in: query
          schema: { type: string, enum: [high, medium, low] }
      responses:
        '200':
          description: Upcoming market events ordered by event time.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketCalendarResponse' }
        '503':
          description: No event source is configured or available.
  /market/correlations:
    get:
      operationId: getMarketCorrelations
      security: []
      parameters:
        - name: window
          in: query
          required: true
          schema: { type: string, enum: [7d, 30d, 90d] }
      responses:
        '200':
          description: Historical asset correlation pairs for the requested window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketCorrelationsResponse' }
        '503':
          description: No correlation data source is configured or available.
  /market/unlocks:
    get:
      operationId: getMarketTokenUnlocks
      security: []
      parameters:
        - name: window
          in: query
          required: true
          schema: { type: string, enum: [7d, 30d, 90d] }
        - name: category
          in: query
          schema: { type: string, enum: [team, investor, ecosystem, community, foundation] }
      responses:
        '200':
          description: Upcoming token unlock schedules from the configured source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketTokenUnlocksResponse' }
        '503':
          description: No token unlock source is configured or available.
  /market/derivatives:
    get:
      operationId: getMarketDerivatives
      security: []
      responses:
        '200':
          description: Read-only derivatives market snapshot from the configured data source.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketDerivativesResponse' }
        '503':
          description: No derivatives data source is configured or available.
  /market/sentiment:
    get:
      operationId: getMarketSentiment
      security: []
      parameters:
        - name: window
          in: query
          required: true
          schema: { type: string, enum: [24h, 7d, 30d] }
      responses:
        '200':
          description: Source-reported public social sentiment snapshot for the selected window.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketSentimentResponse' }
        '503':
          description: No social sentiment data source is configured or available.
  /market/signals:
    get:
      operationId: getMarketSignals
      security: []
      responses:
        '200':
          description: Latest source-reported social trading signals; informational only and never executed by this endpoint.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketSignalsResponse' }
        '503':
          description: No social signals data source is configured or available.
  /market/price-alerts:
    get:
      operationId: listMarketPriceAlerts
      x-required-permissions: [market:read]
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, triggered] }
      responses:
        '200':
          description: Price alerts owned by the current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketPriceAlertsResponse' }
    post:
      operationId: createMarketPriceAlert
      x-required-permissions: [market:alerts:write]
      security:
        - sessionCookie: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketPriceAlertCreateRequest' }
      responses:
        '201':
          description: Price alert created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketPriceAlert' }
  /market/price-alerts/{alertId}:
    patch:
      operationId: updateMarketPriceAlert
      x-required-permissions: [market:alerts:write]
      security:
        - sessionCookie: []
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketPriceAlertUpdateRequest' }
      responses:
        '200':
          description: Price alert updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketPriceAlert' }
    delete:
      operationId: deleteMarketPriceAlert
      x-required-permissions: [market:alerts:write]
      security:
        - sessionCookie: []
      parameters:
        - name: alertId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Price alert deleted. }
  /market/pairs:
    get:
      operationId: listMarketPairs
      security: []
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          description: Market pairs page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketPairsResponse' }
  /market/pairs/{pairId}:
    get:
      operationId: getMarketPair
      security: []
      parameters:
        - { name: pairId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Market pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketPair' }
        '404':
          description: Pair not found.
  /market/watchlist:
    get:
      operationId: getMarketWatchlist
      x-required-permissions: [market:read]
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Watchlist items owned by the current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketWatchlistResponse' }
    post:
      operationId: addMarketWatchlistItem
      x-required-permissions: [market:watchlist:write]
      security:
        - sessionCookie: []
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pairId]
              properties:
                pairId: { type: string, minLength: 1 }
                note: { type: string }
      responses:
        '201':
          description: Watchlist item created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketWatchlistItem' }
  /market/pairs/{pairId}/orderbook:
    get:
      operationId: getMarketOrderBook
      security: []
      parameters:
        - name: pairId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Current order book snapshot for the pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketOrderBookResponse' }
  /market/pairs/{pairId}/trades:
    get:
      operationId: getMarketRecentTrades
      security: []
      parameters:
        - name: pairId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Recent public trades for the pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketRecentTradesResponse' }
  /market/pairs/{pairId}/candles:
    get:
      operationId: getMarketCandles
      security: []
      parameters:
        - name: pairId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: interval
          in: query
          required: true
          schema: { type: string, enum: [5m, 15m, 1h, 4h, 1d, 1w] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: OHLCV candles for the requested market pair and interval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketCandlesResponse' }
        '404':
          description: Pair not found.
  /market/watchlist/{watchlistId}:
    patch:
      operationId: updateMarketWatchlistItem
      x-required-permissions: [market:watchlist:write]
      security:
        - sessionCookie: []
      parameters:
        - name: watchlistId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        '200':
          description: Watchlist item updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketWatchlistItem' }
    delete:
      operationId: deleteMarketWatchlistItem
      x-required-permissions: [market:watchlist:write]
      security:
        - sessionCookie: []
      parameters:
        - name: watchlistId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '204': { description: Watchlist item deleted. }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16 }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: vittrade_session
  schemas:
    MarketPairsResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MarketPair' } }
        nextCursor: { type: string }
    MarketPair:
      type: object
      required:
        [
          id,
          symbol,
          baseAsset,
          quoteAsset,
          price,
          prevPrice,
          change24h,
          high24h,
          low24h,
          volume24h,
          marketCap,
          sparklineData,
          logoColor,
          category,
        ]
      properties:
        id: { type: string }
        symbol: { type: string }
        baseAsset: { type: string }
        quoteAsset: { type: string }
        price: { type: number }
        prevPrice: { type: number }
        change24h: { type: number }
        high24h: { type: number }
        low24h: { type: number }
        volume24h: { type: number }
        marketCap: { type: number }
        sparklineData: { type: array, items: { type: number } }
        logoColor: { type: string }
        category: { type: string }
    MarketWatchlistItem:
      type: object
      required: [id, pairId, addedAt]
      properties:
        id: { type: string }
        pairId: { type: string }
        addedAt: { type: string, format: date-time }
        note: { type: string }
    MarketWatchlistResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MarketWatchlistItem' } }
    MarketOrderBookEntry:
      type: object
      required: [price, amount, total, depth]
      properties:
        price: { type: number, minimum: 0 }
        amount: { type: number, minimum: 0 }
        total: { type: number, minimum: 0 }
        depth: { type: number, minimum: 0, maximum: 1 }
    MarketOrderBookResponse:
      type: object
      required: [bids, asks, updatedAt]
      properties:
        bids: { type: array, items: { $ref: '#/components/schemas/MarketOrderBookEntry' } }
        asks: { type: array, items: { $ref: '#/components/schemas/MarketOrderBookEntry' } }
        updatedAt: { type: string, format: date-time }
    MarketRecentTrade:
      type: object
      required: [id, price, amount, side, time]
      properties:
        id: { type: string }
        price: { type: number, minimum: 0 }
        amount: { type: number, minimum: 0 }
        side: { type: string, enum: [buy, sell] }
        time: { type: string, format: date-time }
    MarketRecentTradesResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MarketRecentTrade' } }
    MarketCandlesResponse:
      type: object
      required: [items, updatedAt]
      properties:
        items:
          type: array
          description: Candles ordered oldest first with unique timestamps.
          items: { $ref: '#/components/schemas/MarketCandle' }
        updatedAt: { type: string, format: date-time }
    MarketCandle:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time: { type: integer, format: int64, description: Unix timestamp in seconds }
        open: { type: number, minimum: 0 }
        high:
          type: number
          minimum: 0
          description: At least the maximum of open and close.
        low:
          type: number
          minimum: 0
          description: At most the minimum of open and close.
        close: { type: number, minimum: 0 }
        volume: { type: number, minimum: 0 }
    MarketOverviewStats:
      type: object
      required:
        [
          totalMarketCap,
          totalMarketCapChange24h,
          total24hVolume,
          total24hVolumeChange,
          btcDominance,
          ethDominance,
          totalCoins,
          totalExchanges,
          fearGreedIndex,
          fearGreedLabel,
          activeCryptocurrencies,
          defiTVL,
          defiTVLChange24h,
          stablecoinVolume24h,
        ]
      properties:
        totalMarketCap: { type: number, minimum: 0 }
        totalMarketCapChange24h: { type: number }
        total24hVolume: { type: number, minimum: 0 }
        total24hVolumeChange: { type: number }
        btcDominance: { type: number, minimum: 0, maximum: 100 }
        ethDominance: { type: number, minimum: 0, maximum: 100 }
        totalCoins: { type: integer, minimum: 0 }
        totalExchanges: { type: integer, minimum: 0 }
        fearGreedIndex: { type: integer, minimum: 0, maximum: 100 }
        fearGreedLabel: { type: string }
        activeCryptocurrencies: { type: integer, minimum: 0 }
        defiTVL: { type: number, minimum: 0 }
        defiTVLChange24h: { type: number }
        stablecoinVolume24h: { type: number, minimum: 0 }
    MarketOverviewBreadth:
      type: object
      required: [advancing, declining, unchanged, newATH, dropping10Pct]
      properties:
        advancing: { type: integer, minimum: 0 }
        declining: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        newATH: { type: integer, minimum: 0 }
        dropping10Pct: { type: integer, minimum: 0 }
    MarketFearGreedPoint:
      type: object
      required: [date, value, label]
      properties:
        date: { type: string }
        value: { type: integer, minimum: 0, maximum: 100 }
        label: { type: string }
    MarketSectorSummary:
      type: object
      required:
        [
          id,
          name,
          nameVi,
          color,
          icon,
          totalMarketCap,
          change24h,
          change7d,
          change30d,
          volume24h,
          topCoins,
          coinCount,
          dominance,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        nameVi: { type: string }
        color: { type: string }
        icon: { type: string }
        totalMarketCap: { type: number, minimum: 0 }
        change24h: { type: number }
        change7d: { type: number }
        change30d: { type: number }
        volume24h: { type: number, minimum: 0 }
        topCoins: { type: array, items: { type: string } }
        coinCount: { type: integer, minimum: 0 }
        dominance: { type: number, minimum: 0 }
    MarketMoverSummary:
      type: object
      required:
        [
          id,
          symbol,
          name,
          price,
          change1h,
          change24h,
          change7d,
          volume24h,
          volumeChange24h,
          marketCap,
          category,
          color,
          sparkline,
        ]
      properties:
        id: { type: string }
        symbol: { type: string }
        name: { type: string }
        price: { type: number, minimum: 0 }
        change1h: { type: number }
        change24h: { type: number }
        change7d: { type: number }
        volume24h: { type: number, minimum: 0 }
        volumeChange24h: { type: number }
        marketCap: { type: number, minimum: 0 }
        category: { type: string }
        color: { type: string }
        sparkline: { type: array, items: { type: number } }
        isNew: { type: boolean }
        listingDate: { type: string, format: date }
    MarketOverviewResponse:
      type: object
      required: [stats, breadth, fearGreedHistory, sectors, topGainers, topLosers, updatedAt]
      properties:
        stats: { $ref: '#/components/schemas/MarketOverviewStats' }
        breadth: { $ref: '#/components/schemas/MarketOverviewBreadth' }
        fearGreedHistory:
          { type: array, items: { $ref: '#/components/schemas/MarketFearGreedPoint' } }
        sectors: { type: array, items: { $ref: '#/components/schemas/MarketSectorSummary' } }
        topGainers: { type: array, items: { $ref: '#/components/schemas/MarketMoverSummary' } }
        topLosers: { type: array, items: { $ref: '#/components/schemas/MarketMoverSummary' } }
        updatedAt: { type: string, format: date-time }
    MarketMoversResponse:
      type: object
      required: [items, updatedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MarketMoverSummary' } }
        updatedAt: { type: string, format: date-time }
    MarketNewsItem:
      type: object
      required:
        [
          id,
          title,
          summary,
          category,
          sentiment,
          source,
          articleUrl,
          publishedAt,
          relatedPairs,
          isBreaking,
        ]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        summary: { type: string, minLength: 1 }
        category: { type: string, enum: [market, macro, regulation, project] }
        sentiment: { type: string, enum: [bullish, neutral, bearish] }
        source: { type: string, minLength: 1 }
        articleUrl: { type: string, format: uri, description: HTTPS URL to the original article. }
        publishedAt: { type: string, format: date-time }
        relatedPairs:
          type: array
          items:
            type: object
            required: [pairId, symbol]
            properties:
              pairId: { type: string, minLength: 1 }
              symbol: { type: string, minLength: 1 }
        isBreaking: { type: boolean }
    MarketNewsResponse:
      type: object
      required: [items, updatedAt]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MarketNewsItem' } }
        updatedAt: { type: string, format: date-time }
    MarketCalendarEvent:
      type: object
      required: [id, title, type, eventAt, impact, description, confirmed]
      properties:
        id: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        type:
          {
            type: string,
            enum: [unlock, upgrade, halving, airdrop, listing, fork, burn, conference, report],
          }
        eventAt: { type: string, format: date-time }
        symbol: { type: string, minLength: 1 }
        impact: { type: string, enum: [high, medium, low] }
        description: { type: string, minLength: 1 }
        sourceUrl: { type: string, format: uri, description: Optional HTTPS source link. }
        confirmed: { type: boolean }
    MarketCalendarResponse:
      type: object
      required: [items, updatedAt]
      properties:
        items:
          type: array
          description: Upcoming events ordered by eventAt ascending.
          items: { $ref: '#/components/schemas/MarketCalendarEvent' }
        updatedAt: { type: string, format: date-time }
    MarketCorrelationPair:
      type: object
      required: [assetA, assetB, coefficient, observations]
      properties:
        assetA: { type: string, minLength: 1 }
        assetB: { type: string, minLength: 1 }
        coefficient: { type: number, minimum: -1, maximum: 1 }
        observations: { type: integer, minimum: 2 }
    MarketCorrelationsResponse:
      type: object
      required: [window, method, provider, items, updatedAt]
      properties:
        window: { type: string, enum: [7d, 30d, 90d] }
        method: { type: string, enum: [pearson, spearman] }
        provider: { type: string, minLength: 1 }
        items:
          type: array
          description: Each unordered asset pair appears once; self-pairs are excluded.
          items: { $ref: '#/components/schemas/MarketCorrelationPair' }
        updatedAt: { type: string, format: date-time }
    MarketTokenUnlock:
      type: object
      required:
        [
          id,
          symbol,
          name,
          eventAt,
          amount,
          circulatingSupplyPercent,
          category,
          scheduleType,
          status,
          sourceUrl,
        ]
      properties:
        id: { type: string, minLength: 1 }
        symbol: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        eventAt: { type: string, format: date-time }
        amount: { type: number, minimum: 0, description: Amount denominated in the token. }
        circulatingSupplyPercent:
          {
            type: number,
            minimum: 0,
            maximum: 100,
            description: Percent of the source-reported circulating supply.,
          }
        category: { type: string, enum: [team, investor, ecosystem, community, foundation] }
        scheduleType: { type: string, enum: [cliff, linear, milestone] }
        status: { type: string, enum: [confirmed, estimated] }
        sourceUrl: { type: string, format: uri, description: HTTPS link to the source schedule. }
    MarketTokenUnlocksResponse:
      type: object
      required: [window, provider, items, updatedAt]
      properties:
        window: { type: string, enum: [7d, 30d, 90d] }
        provider: { type: string, minLength: 1 }
        items:
          type: array
          description: Events within the requested window ordered by eventAt ascending.
          items: { $ref: '#/components/schemas/MarketTokenUnlock' }
        updatedAt: { type: string, format: date-time }
    MarketDerivativesResponse:
      type: object
      required: [provider, updatedAt, stats, pairs, liquidationHistory]
      properties:
        provider: { type: string, minLength: 1 }
        updatedAt: { type: string, format: date-time }
        stats:
          type: object
          required:
            [
              totalOpenInterest,
              openInterestChange24h,
              totalVolume24h,
              volumeChange24h,
              totalLiquidations24h,
              longLiquidations24h,
              shortLiquidations24h,
              averageFundingRate8h,
              btcLongShortRatio,
            ]
          properties:
            totalOpenInterest: { type: number, minimum: 0, description: USD value. }
            openInterestChange24h: { type: number, description: Percent change over 24 hours. }
            totalVolume24h: { type: number, minimum: 0, description: USD value. }
            volumeChange24h: { type: number, description: Percent change over 24 hours. }
            totalLiquidations24h: { type: number, minimum: 0, description: USD value. }
            longLiquidations24h: { type: number, minimum: 0, description: USD value. }
            shortLiquidations24h: { type: number, minimum: 0, description: USD value. }
            averageFundingRate8h:
              { type: number, description: Funding rate as a decimal ratio for an 8-hour interval. }
            btcLongShortRatio: { type: number, exclusiveMinimum: 0 }
        pairs:
          type: array
          items:
            type: object
            required:
              [
                id,
                symbol,
                name,
                price,
                change24h,
                fundingRate,
                openInterest,
                openInterestChange24h,
                volume24h,
                longSharePercent,
                liquidations24h,
              ]
            properties:
              id: { type: string, minLength: 1 }
              symbol: { type: string, minLength: 1 }
              name: { type: string, minLength: 1 }
              price: { type: number, minimum: 0 }
              change24h: { type: number, description: Percent change over 24 hours. }
              fundingRate: { type: number, description: Funding rate as a decimal ratio. }
              openInterest: { type: number, minimum: 0, description: USD value. }
              openInterestChange24h: { type: number, description: Percent change over 24 hours. }
              volume24h: { type: number, minimum: 0, description: USD value. }
              longSharePercent: { type: number, minimum: 0, maximum: 100 }
              liquidations24h:
                type: object
