              short: { type: number, minimum: 0, description: USD value. }
    MarketSentimentResponse:
      type: object
      required: [window, provider, updatedAt, overall, timeline, tokens, trendingTopics]
      properties:
        window: { type: string, enum: [24h, 7d, 30d] }
        provider: { type: string, minLength: 1 }
        updatedAt: { type: string, format: date-time }
        overall:
          type: object
          required:
            [
              score,
              sentiment,
              totalMentions24h,
              mentionsChange24h,
              trendingTokenCount,
              socialDominance,
            ]
          properties:
            score: { type: number, minimum: -100, maximum: 100 }
            sentiment: { type: string, enum: [bullish, neutral, bearish] }
            totalMentions24h: { type: integer, minimum: 0 }
            mentionsChange24h: { type: number }
            trendingTokenCount: { type: integer, minimum: 0 }
            socialDominance:
              type: object
              description: Source-reported shares of social mentions; percentages sum to 100 within rounding tolerance.
              required: [btcPercent, ethPercent, otherPercent]
              properties:
                btcPercent: { type: number, minimum: 0, maximum: 100 }
                ethPercent: { type: number, minimum: 0, maximum: 100 }
                otherPercent: { type: number, minimum: 0, maximum: 100 }
        timeline:
          type: array
          description: Ordered source-reported observations for the selected window.
          items:
            type: object
            required: [at, score, mentions]
            properties:
              at: { type: string, format: date-time }
              score: { type: number, minimum: -100, maximum: 100 }
              mentions: { type: integer, minimum: 0 }
        tokens:
          type: array
          items:
            type: object
            required:
              [
                id,
                symbol,
                name,
                score,
                sentiment,
                mentions24h,
                mentionsChange24h,
                sentimentSharePercent,
                topTopics,
              ]
            properties:
              id: { type: string, minLength: 1 }
              symbol: { type: string, minLength: 1 }
              name: { type: string, minLength: 1 }
              score: { type: number, minimum: -100, maximum: 100 }
              sentiment: { type: string, enum: [bullish, neutral, bearish] }
              mentions24h: { type: integer, minimum: 0 }
              mentionsChange24h: { type: number }
              sentimentSharePercent:
                type: object
                description: Bullish, neutral and bearish shares; percentages sum to 100 within rounding tolerance.
                required: [bullish, neutral, bearish]
                properties:
                  bullish: { type: number, minimum: 0, maximum: 100 }
                  neutral: { type: number, minimum: 0, maximum: 100 }
                  bearish: { type: number, minimum: 0, maximum: 100 }
              trendingRank: { type: integer, minimum: 1 }
              topTopics:
                type: array
                items: { type: string, minLength: 1 }
        trendingTopics:
          type: array
          items:
            type: object
            required: [topic, mentions24h, change24h]
            properties:
              topic: { type: string, minLength: 1 }
              mentions24h: { type: integer, minimum: 0 }
              change24h: { type: number }
    MarketSignalsResponse:
      type: object
      required: [provider, updatedAt, items]
      properties:
        provider:
          { type: string, minLength: 1, description: Data provider that supplied the response. }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          maxItems: 100
          description: Latest source-reported signals ordered by publication time, newest first.
          items:
            type: object
            required:
              [
                id,
                providerName,
                symbol,
                direction,
                category,
                status,
                publishedAt,
                rationale,
                sourceUrl,
              ]
            properties:
              id: { type: string, minLength: 1 }
              providerName:
                { type: string, minLength: 1, description: Source-reported signal publisher. }
              symbol: { type: string, minLength: 1 }
              direction: { type: string, enum: [long, short] }
              category: { type: string, enum: [scalp, swing, position] }
              status:
                {
                  type: string,
                  enum: [active, closed, expired],
                  description: Source-reported status.,
                }
              publishedAt: { type: string, format: date-time }
              expiresAt:
                {
                  type: string,
                  format: date-time,
                  description: If present,
                  must be after publishedAt.,
                }
              rationale:
                {
                  type: string,
                  minLength: 1,
                  description: Source-provided rationale; informational,
                  not a recommendation.,
                }
              sourceUrl:
                {
                  type: string,
                  format: uri,
                  pattern: '^https://',
                  description: HTTPS link to the original signal.,
                }
    MarketPriceAlert:
      type: object
      required: [id, pairId, symbol, condition, targetPrice, currentPrice, isActive, createdAt]
      properties:
        id: { type: string }
        pairId: { type: string }
        symbol: { type: string }
        condition: { type: string, enum: [above, below] }
        targetPrice: { type: number, exclusiveMinimum: 0 }
        currentPrice: { type: number, minimum: 0 }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        triggeredAt: { type: string, format: date-time }
    MarketPriceAlertCreateRequest:
      type: object
      required: [pairId, condition, targetPrice]
      properties:
        pairId: { type: string, minLength: 1 }
        condition: { type: string, enum: [above, below] }
        targetPrice: { type: number, exclusiveMinimum: 0 }
    MarketPriceAlertUpdateRequest:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    MarketPriceAlertsResponse:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MarketPriceAlert' } }
